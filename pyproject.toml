[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steel-flow-sensor-prediction"
version = "0.1.0"
description = "XGBoost pipeline for predicting steel flow sensor targets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "rich",
    "xgboost",
    "optuna",
    "shap",
    "scikit-learn",
    "pandas",
    "openpyxl",
    "seaborn",
    "tomli",
    "wandb>=0.26.1",
]

[project.scripts]
tune = "steel_flow.cli:tune"
train = "steel_flow.cli:train"
predict = "steel_flow.cli:predict"
replications = "steel_flow.replications:main"
experiments = "steel_flow.experiments:main"

[tool.hatch.build.targets.wheel]
packages = ["src/steel_flow"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
