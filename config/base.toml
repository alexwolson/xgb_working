[experiment]
targets = ["Count_EX1"]
study_name = "water_modelling"
objective = "reg:squarederror"

[data]
directory = "data/raw/Organized_Data"
discard_features = []
onehot_encoding = false
sen_geometrical = false
clogging_factors = false
lagged_features = []
feature_lag_amount = 0
mould_position = false
remove_rows = 0
include_subdirs = []
exclude_subdirs = []

[tune]
study_count = 1
tree_method = "gpu_hist"
storage_path = "sqlite:///optuna/water_modelling.db"
multithread = false

[train]
subsample_shap = false
config_file = ""

[predict]
config_file = "config/training_config_water_modelling.json"
data_directory = "New_Data"
piv_data = false

[wandb]
project = "steel-flow"
entity = ""
enabled = true

[bins]
enabled = false
n_bins = 3
strategy = "equal_frequency"   # "equal_frequency" | "equal_width" | "log"
